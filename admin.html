<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Store - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f6f8;
color:#111827;
}

button,input,textarea,select{
font-family:inherit;
}

button{
cursor:pointer;
}

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#111;
padding:20px;
}

.login-box{
background:white;
width:100%;
max-width:420px;
padding:35px;
border-radius:14px;
}

.login-box h1{
margin-bottom:10px;
}

.login-box p{
color:#6b7280;
margin-bottom:25px;
}

.form-group{
margin-bottom:16px;
}

.form-group label{
display:block;
font-size:14px;
font-weight:700;
margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:7px;
outline:none;
}

.form-group textarea{
min-height:100px;
resize:vertical;
}

.primary-btn{
width:100%;
padding:13px;
background:#111;
color:white;
border:0;
border-radius:7px;
font-weight:700;
}

.message{
margin-top:15px;
padding:12px;
border-radius:7px;
display:none;
font-size:14px;
}

.message.error{
display:block;
background:#fee2e2;
color:#991b1b;
}

.message.success{
display:block;
background:#dcfce7;
color:#166534;
}


/* ADMIN */

.admin{
display:none;
min-height:100vh;
}

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:240px;
background:#111;
color:white;
padding:25px 15px;
z-index:1000;
}

.brand{
font-size:23px;
font-weight:800;
padding:0 12px 30px;
}

.side-btn{
display:block;
width:100%;
text-align:left;
padding:13px 12px;
margin-bottom:5px;
border:0;
background:transparent;
color:#ddd;
border-radius:7px;
font-size:14px;
}

.side-btn:hover,
.side-btn.active{
background:#292929;
color:white;
}

.logout{
margin-top:25px;
color:#ffb4b4;
}

.main{
margin-left:240px;
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.topbar h1{
font-size:30px;
}

.admin-email{
color:#6b7280;
font-size:14px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
margin-bottom:30px;
}

.stat{
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:22px;
}

.stat-title{
font-size:13px;
color:#6b7280;
margin-bottom:10px;
}

.stat-number{
font-size:30px;
font-weight:800;
}

.page{
display:none;
}

.page.active{
display:block;
}

.panel{
background:white;
border:1px solid #e5e7eb;
border-radius:12px;
padding:22px;
margin-bottom:25px;
}

.panel-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.panel-header h2{
font-size:20px;
}

.search{
padding:11px 14px;
border:1px solid #d1d5db;
border-radius:7px;
outline:none;
min-width:230px;
}

.add-btn{
background:#111;
color:white;
border:0;
padding:11px 17px;
border-radius:7px;
font-weight:700;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:750px;
}

th,
td{
padding:13px 10px;
border-bottom:1px solid #eee;
text-align:left;
font-size:14px;
vertical-align:middle;
}

th{
background:#f9fafb;
font-size:12px;
text-transform:uppercase;
color:#6b7280;
}

.product-thumb{
width:55px;
height:55px;
object-fit:cover;
border-radius:7px;
background:#eee;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
font-size:12px;
font-weight:700;
}

.badge.active{
background:#dcfce7;
color:#166534;
}

.badge.inactive{
background:#f3f4f6;
color:#555;
}

.badge.pending{
background:#fef3c7;
color:#92400e;
}

.badge.confirmed{
background:#dbeafe;
color:#1e40af;
}

.badge.shipped{
background:#e0e7ff;
color:#3730a3;
}

.badge.delivered{
background:#dcfce7;
color:#166534;
}

.badge.cancelled{
background:#fee2e2;
color:#991b1b;
}

.action-btn{
border:0;
padding:7px 10px;
border-radius:6px;
font-size:12px;
font-weight:700;
margin-right:5px;
}

.edit{
background:#e5e7eb;
}

.delete{
background:#fee2e2;
color:#991b1b;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.full{
grid-column:1/-1;
}

.save-btn{
background:#111;
color:white;
border:0;
padding:13px 25px;
border-radius:7px;
font-weight:700;
}

.cancel-btn{
background:#e5e7eb;
color:#111;
border:0;
padding:13px 25px;
border-radius:7px;
font-weight:700;
margin-left:8px;
}

.preview{
width:100px;
height:100px;
object-fit:cover;
border-radius:8px;
display:none;
margin-top:10px;
}

.order-customer{
font-weight:700;
margin-bottom:4px;
}

.order-detail{
color:#6b7280;
font-size:13px;
line-height:1.6;
}

.status-select{
padding:8px;
border:1px solid #d1d5db;
border-radius:6px;
background:white;
}

.empty{
text-align:center;
padding:40px;
color:#777;
}

.mobile-menu{
display:none;
}

@media(max-width:900px){

.sidebar{
width:200px;
}

.main{
margin-left:200px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

.sidebar{
display:none;
}

.main{
margin-left:0;
padding:18px;
}

.mobile-menu{
display:block;
background:#111;
color:white;
border:0;
padding:10px 14px;
border-radius:7px;
}

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.stats{
grid-template-columns:1fr 1fr;
}

.topbar{
gap:10px;
}

.topbar h1{
font-size:23px;
}

.search{
min-width:150px;
width:100%;
}

.panel-header{
align-items:stretch;
flex-direction:column;
}

}


/* MOBILE SIDEBAR */

.mobile-sidebar{
display:none;
position:fixed;
inset:0;
z-index:3000;
}

.mobile-sidebar.show{
display:block;
}

.mobile-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
}

.mobile-side{
position:absolute;
left:0;
top:0;
bottom:0;
width:250px;
background:#111;
color:white;
padding:25px 15px;
}

</style>
</head>

<body>


<!-- LOGIN -->

<div class="login-page" id="loginPage">

<div class="login-box">

<h1>My Store Admin</h1>

<p>Login to manage your store.</p>

<form id="loginForm">

<div class="form-group">

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Admin email"
required
>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Password"
required
>

</div>

<button
class="primary-btn"
type="submit"
id="loginBtn"
>
Login
</button>

<div
class="message"
id="loginMessage"
></div>

</form>

</div>

</div>


<!-- ADMIN -->

<div class="admin" id="admin">


<!-- SIDEBAR -->

<aside class="sidebar">

<div class="brand">
My Store
</div>

<button
class="side-btn active"
onclick="showPage('dashboard',this)"
>
📊 Dashboard
</button>

<button
class="side-btn"
onclick="showPage('products',this)"
>
📦 Products
</button>

<button
class="side-btn"
onclick="showPage('addProduct',this)"
>
➕ Add Product
</button>

<button
class="side-btn"
onclick="showPage('orders',this)"
>
🛒 Orders
</button>

<button
class="side-btn logout"
onclick="logout()"
>
🚪 Logout
</button>

</aside>


<!-- MAIN -->

<main class="main">


<div class="topbar">

<div>

<button
class="mobile-menu"
onclick="openMobileMenu()"
>
☰
</button>

<h1 id="pageTitle">
Dashboard
</h1>

</div>

<div
class="admin-email"
id="adminEmail"
></div>

</div>


<!-- DASHBOARD -->

<section
class="page active"
id="dashboard"
>

<div class="stats">

<div class="stat">

<div class="stat-title">
Total Products
</div>

<div
class="stat-number"
id="totalProducts"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Active Products
</div>

<div
class="stat-number"
id="activeProducts"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Total Orders
</div>

<div
class="stat-number"
id="totalOrders"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Pending Orders
</div>

<div
class="stat-number"
id="pendingOrders"
>
0
</div>

</div>

</div>


<div class="panel">

<div class="panel-header">

<h2>
Recent Orders
</h2>

<button
class="add-btn"
onclick="showPageByName('orders')"
>
View All
</button>

</div>

<div
class="table-wrap"
id="recentOrders"
>
Loading...
</div>

</div>

</section>


<!-- PRODUCTS -->

<section
class="page"
id="products"
>

<div class="panel">

<div class="panel-header">

<h2>
All Products
</h2>

<div>

<input
class="search"
id="productSearch"
placeholder="Search products..."
oninput="renderProducts()"
>

<button
class="add-btn"
onclick="showPageByName('addProduct')"
>
+ Add Product
</button>

</div>

</div>

<div
class="table-wrap"
id="productsTable"
>
Loading...
</div>

</div>

</section>


<!-- ADD / EDIT PRODUCT -->

<section
class="page"
id="addProduct"
>

<div class="panel">

<div class="panel-header">

<h2 id="productFormTitle">
Add New Product
</h2>

</div>

<form id="productForm">

<input
type="hidden"
id="editProductId"
>

<div class="form-grid">


<div class="form-group">

<label>
Product Name *
</label>

<input
type="text"
id="productName"
placeholder="Example: Black Watch"
required
>

</div>


<div class="form-group">

<label>
Slug *
</label>

<input
type="text"
id="productSlug"
placeholder="black-watch"
required
>

</div>


<div class="form-group">

<label>
Price *
</label>

<input
type="number"
id="productPrice"
placeholder="2000"
min="0"
required
>

</div>


<div class="form-group">

<label>
Stock *
</label>

<input
type="number"
id="productStock"
placeholder="10"
min="0"
required
>

</div>


<div class="form-group">

<label>
Category
</label>

<input
type="text"
id="productCategory"
placeholder="Watches"
>

</div>


<div class="form-group">

<label>
Status
</label>

<select id="productStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

</div>


<div class="form-group full">

<label>
Description
</label>

<textarea
id="productDescription"
placeholder="Write product details..."
></textarea>

</div>


<div class="form-group full">

<label>
Product Image
</label>

<input
type="file"
id="productImage"
accept="image/*"
>

<img
id="imagePreview"
class="preview"
src=""
>

</div>


</div>


<button
class="save-btn"
type="submit"
id="saveProductBtn"
>
Save Product
</button>

<button
class="cancel-btn"
type="button"
onclick="resetProductForm()"
>
Clear
</button>


<div
class="message"
id="productMessage"
></div>

</form>

</div>

</section>


<!-- ORDERS -->

<section
class="page"
id="orders"
>

<div class="panel">

<div class="panel-header">

<h2>
Customer Orders
</h2>

<input
class="search"
id="orderSearch"
placeholder="Search customer / phone..."
oninput="renderOrders()"
>

</div>

<div
class="table-wrap"
id="ordersTable"
>
Loading...
</div>

</div>

</section>


</main>

</div>


<!-- MOBILE SIDEBAR -->

<div
class="mobile-sidebar"
id="mobileSidebar"
>

<div
class="mobile-overlay"
onclick="closeMobileMenu()"
></div>

<div class="mobile-side">

<div class="brand">
My Store
</div>

<button
class="side-btn"
onclick="mobilePage('dashboard')"
>
📊 Dashboard
</button>

<button
class="side-btn"
onclick="mobilePage('products')"
>
📦 Products
</button>

<button
class="side-btn"
onclick="mobilePage('addProduct')"
>
➕ Add Product
</button>

<button
class="side-btn"
onclick="mobilePage('orders')"
>
🛒 Orders
</button>

<button
class="side-btn logout"
onclick="logout()"
>
🚪 Logout
</button>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://qmchlafchuvldumxurbl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WXqvOXVXfmojAFPOG74SQw_fvurPlBB";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* DATA */

let products = [];

let orders = [];


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document
.getElementById("loginEmail")
.value.trim();

const password =
document
.getElementById("loginPassword")
.value;


const button =
document.getElementById("loginBtn");

button.disabled = true;
button.textContent = "Logging in...";


const {data,error} =
await db.auth.signInWithPassword({
email:email,
password:password
});


if(error){

showMessage(
"loginMessage",
error.message,
"error"
);

button.disabled = false;
button.textContent = "Login";

return;

}


showAdmin(data.user);

}
);


/* SESSION */

async function checkSession(){

const {data} =
await db.auth.getSession();

if(data.session){

showAdmin(data.session.user);

}

}


function showAdmin(user){

document
.getElementById("loginPage")
.style.display = "none";

document
.getElementById("admin")
.style.display = "block";

document
.getElementById("adminEmail")
.textContent =
user.email || "";

loadAll();

}


/* LOGOUT */

async function logout(){

await db.auth.signOut();

location.reload();

}


/* NAVIGATION */

function showPage(pageId,button){

document
.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});


document
.getElementById(pageId)
.classList.add("active");


document
.querySelectorAll(".side-btn")
.forEach(btn=>{
btn.classList.remove("active");
});


if(button){
button.classList.add("active");
}


const titles = {

dashboard:"Dashboard",

products:"Products",

addProduct:"Add Product",

orders:"Orders"

};


document
.getElementById("pageTitle")
.textContent =
titles[pageId] || "Admin";


if(pageId === "products"){
renderProducts();
}

if(pageId === "orders"){
renderOrders();
}

}


function showPageByName(pageId){

const buttons =
document.querySelectorAll(".sidebar .side-btn");

let button = null;

buttons.forEach(btn=>{

if(
btn.textContent
.toLowerCase()
.includes(
pageId === "products"
? "products"
: pageId === "orders"
? "orders"
: pageId === "addProduct"
? "add product"
: "dashboard"
)
){

button = btn;

}

});


showPage(pageId,button);

}


/* MOBILE */

function openMobileMenu(){

document
.getElementById("mobileSidebar")
.classList.add("show");

}

function closeMobileMenu(){

document
.getElementById("mobileSidebar")
.classList.remove("show");

}

function mobilePage(page){

closeMobileMenu();

showPageByName(page);

}


/* LOAD EVERYTHING */

async function loadAll(){

await Promise.all([
loadProducts(),
loadOrders()
]);

updateStats();

renderRecentOrders();

}


/* LOAD PRODUCTS */

async function loadProducts(){

const {data,error} =
await db
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

return;

}

products = data || [];

}


/* LOAD ORDERS */

async function loadOrders(){

const {data,error} =
await db
.from("orders")
.select(`
*,
products (
name,
price,
image_url
)
`)
.order(
"created_at",
{ascending:false}
);


if(error){

console.error(error);

return;

}

orders = data || [];

}


/* STATS */

function updateStats(){

document
.getElementById("totalProducts")
.textContent =
products.length;


document
.getElementById("activeProducts")
.textContent =
products.filter(
p => p.status === "active"
).length;


document
.getElementById("totalOrders")
.textContent =
orders.length;


document
.getElementById("pendingOrders")
.textContent =
orders.filter(
o => o.status === "pending"
).length;

}


/* RENDER PRODUCTS */

function renderProducts(){

const box =
document.getElementById("productsTable");

if(!box) return;


const search =
(
document
.getElementById("productSearch")
?.value || ""
)
.toLowerCase();


const filtered =
products.filter(product=>
(product.name || "")
.toLowerCase()
.includes(search)
);


if(filtered.length === 0){

box.innerHTML =
'<div class="empty">No products found.</div>';

return;

}


let html = `

<table>

<thead>

<tr>

<th>Image</th>
<th>Product</th>
<th>Category</th>
<th>Price</th>
<th>Stock</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody>
`;


filtered.forEach(product=>{

const image =
product.image_url ||
"https://via.placeholder.com/100?text=Product";


html += `

<tr>

<td>

<img
class="product-thumb"
src="${escapeHtml(image)}"
>

</td>

<td>
<strong>
${escapeHtml(product.name)}
</strong>
<br>
<small>
${escapeHtml(product.slug || "")}
</small>
</td>

<td>
${escapeHtml(product.category || "General")}
</td>

<td>
Rs. ${formatPrice(product.price)}
</td>

<td>
${Number(product.stock || 0)}
</td>

<td>

<span class="badge ${
product.status === "active"
? "active"
: "inactive"
}">
${escapeHtml(product.status || "active")}
</span>

</td>

<td>

<button
class="action-btn edit"
onclick="editProduct('${product.id}')"
>
Edit
</button>

<button
class="action-btn delete"
onclick="deleteProduct('${product.id}')"
>
Delete
</button>

</td>

</tr>

`;

});


html += `
</tbody>
</table>
`;

box.innerHTML = html;

}


/* ADD / EDIT PRODUCT */

document
.getElementById("productForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const id =
document
.getElementById("editProductId")
.value;


const name =
document
.getElementById("productName")
.value.trim();


const slug =
document
.getElementById("productSlug")
.value.trim()
.toLowerCase()
.replace(/\s+/g,"-");


const price =
Number(
document
.getElementById("productPrice")
.value
);


const stock =
Number(
document
.getElementById("productStock")
.value
);


const category =
document
.getElementById("productCategory")
.value.trim()
|| "General";


const status =
document
.getElementById("productStatus")
.value;


const description =
document
.getElementById("productDescription")
.value.trim();


const imageFile =
document
.getElementById("productImage")
.files[0];


const button =
document.getElementById("saveProductBtn");


button.disabled = true;
button.textContent = "Saving...";


let imageUrl = "";


/* EXISTING IMAGE */

if(id){

const old =
products.find(
p => String(p.id) === String(id)
);

if(old){

imageUrl =
old.image_url || "";

}

}


/* UPLOAD IMAGE */

if(imageFile){

const extension =
imageFile.name
.split(".")
.pop()
.toLowerCase();


const fileName =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


const filePath =
"products/" +
fileName;


const {error:uploadError} =
await db.storage
.from("product-images")
.upload(
filePath,
imageFile,
{
upsert:false
}
);


if(uploadError){

console.error(uploadError);

showMessage(
"productMessage",
"Image upload failed: " +
uploadError.message,
"error"
);

button.disabled = false;
button.textContent = "Save Product";

return;

}


const {data:urlData} =
db.storage
.from("product-images")
.getPublicUrl(filePath);


imageUrl =
urlData.publicUrl;

}


/* PRODUCT DATA */

const productData = {

name:name,

slug:slug,

price:price,

stock:stock,

category:category,

status:status,

description:description,

image_url:imageUrl

};


let error;


/* EDIT */

if(id){

const result =
await db
.from("products")
.update(productData)
.eq("id",id);

error =
result.error;

}

/* ADD */

else{

const result =
await db
.from("products")
.insert([productData]);

error =
result.error;

}


if(error){

console.error(error);

showMessage(
"productMessage",
error.message,
"error"
);

button.disabled = false;
button.textContent = "Save Product";

return;

}


showMessage(
"productMessage",
id
? "Product updated successfully."
: "Product added successfully.",
"success"
);


resetProductForm();

await loadProducts();

updateStats();

renderProducts();


button.disabled = false;

button.textContent =
"Save Product";

}
);


/* EDIT PRODUCT */

function editProduct(id){

const product =
products.find(
p => String(p.id) === String(id)
);

if(!product) return;


document
.getElementById("editProductId")
.value =
product.id;


document
.getElementById("productName")
.value =
product.name || "";


document
.getElementById("productSlug")
.value =
product.slug || "";


document
.getElementById("productPrice")
.value =
product.price || "";


document
.getElementById("productStock")
.value =
product.stock || 0;


document
.getElementById("productCategory")
.value =
product.category || "General";


document
.getElementById("productStatus")
.value =
product.status || "active";


document
.getElementById("productDescription")
.value =
product.description || "";


document
.getElementById("productFormTitle")
.textContent =
"Edit Product";


if(product.image_url){

const preview =
document
.getElementById("imagePreview");

preview.src =
product.image_url;

preview.style.display =
"block";

}


showPageByName("addProduct");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* RESET */

function resetProductForm(){

document
.getElementById("productForm")
.reset();


document
.getElementById("editProductId")
.value = "";


document
.getElementById("productFormTitle")
.textContent =
"Add New Product";


document
.getElementById("imagePreview")
.style.display =
"none";

document
.getElementById("productMessage")
.className =
"message";

}


/* IMAGE PREVIEW */

document
.getElementById("productImage")
.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file) return;


const reader =
new FileReader();


reader.onload =
function(e){

const preview =
document
.getElementById("imagePreview");

preview.src =
e.target.result;

preview.style.display =
"block";

};


reader.readAsDataURL(file);

}
);


/* DELETE */

async function deleteProduct(id){

const product =
products.find(
p => String(p.id) === String(id)
);


if(!product) return;


const confirmed =
confirm(
'Delete "' +
product.name +
'" permanently?'
);


if(!confirmed) return;


const {error} =
await db
.from("products")
.delete()
.eq("id",id);


if(error){

alert(
"Delete failed: " +
error.message
);

return;

}


await loadProducts();

updateStats();

renderProducts();

alert("Product deleted successfully.");

}


/* RENDER ORDERS */

function renderOrders(){

const box =
document.getElementById("ordersTable");

if(!box) return;


const search =
(
document
.getElementById("orderSearch")
?.value || ""
)
.toLowerCase();


const filtered =
orders.filter(order=>{

const customer =
(order.customer_name || "")
.toLowerCase();

const phone =
(order.phone || "")
.toLowerCase();

const city =
(order.city || "")
.toLowerCase();

const product =
(order.products?.name || "")
.toLowerCase();


return (
customer.includes(search) ||
phone.includes(search) ||
city.includes(search) ||
product.includes(search)
);

});


if(filtered.length === 0){

box.innerHTML =
'<div class="empty">No orders found.</div>';

return;

}


let html = `

<table>

<thead>

<tr>

<th>Order</th>
<th>Product</th>
<th>Customer</th>
<th>Quantity</th>
<th>Total</th>
<th>Status</th>
<th>Date</th>

</tr>

</thead>

<tbody>
`;


filtered.forEach(order=>{

const product =
order.products || {};


const price =
Number(product.price || 0);


const quantity =
Number(order.quantity || 1);


const total =
price * quantity;


html += `

<tr>

<td>

<strong>
#${order.id}
</strong>

</td>


<td>

<strong>
${escapeHtml(
product.name || "Product"
)}
</strong>

<br>

<span class="order-detail">
Rs. ${formatPrice(price)}
</span>

</td>


<td>

<div class="order-customer">
${escapeHtml(
order.customer_name
)}
</div>

<div class="order-detail">

📞 ${escapeHtml(order.phone)}

<br>

📍 ${escapeHtml(order.city || "")}

<br>

${escapeHtml(order.address || "")}

${
order.note
? "<br>📝 " +
escapeHtml(order.note)
: ""
}

</div>

</td>


<td>
${quantity}
</td>


<td>
<strong>
Rs. ${formatPrice(total)}
</strong>
</td>


<td>

<select
class="status-select"
onchange="updateOrderStatus('${order.id}',this.value)"
>

${statusOption("pending",order.status)}

${statusOption("confirmed",order.status)}

${statusOption("shipped",order.status)}

${statusOption("delivered",order.status)}

${statusOption("cancelled",order.status)}

</select>

</td>


<td>
${formatDate(order.created_at)}
</td>

</tr>

`;

});


html += `
</tbody>
</table>
`;

box.innerHTML = html;

}


/* STATUS OPTION */

function statusOption(value,current){

return `
<option
value="${value}"
${current === value ? "selected" : ""}
>
${value.charAt(0).toUpperCase() + value.slice(1)}
</option>
`;

}


/* UPDATE ORDER STATUS */

async function updateOrderStatus(id,status){

const {error} =
await db
.from("orders")
.update({
status:status
})
.eq("id",id);


if(error){

alert(
"Status update failed: " +
error.message
);

return;

}


const order =
orders.find(
o => String(o.id) === String(id)
);


if(order){

order.status =
status;

}


updateStats();

renderRecentOrders();

}

orders.slice(0,5);

<table>

<th>Status</th>

<tbody>
`;

#${order.id}
</td>

)}

)}

</span>

</table>
`;

}


/* FORMAT PRICE */

function formatPrice(price){

return Number(price || 0)
.toLocaleString("en-PK",{
maximumFractionDigits:0
});

}


/* FORMAT DATE */

function formatDate(date){

if(!date) return "";

return new Date(date)
.toLocaleDateString(
"en-PK",
{
day:"2-digit",
month:"short",
year:"numeric"
}
);

}


/* MESSAGE */

function showMessage(id,text,type){

const box =
document.getElementById(id);

box.textContent =
text;

box.className =
"message " + type;

}


/* ESCAPE */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

checkSession();

</script>
