<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Store Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f7;
  color:#202223;
}


/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:240px;
  height:100vh;
  background:#111;
  color:white;
  padding:25px 15px;
  z-index:1000;
}

.brand{
  font-size:24px;
  font-weight:bold;
  padding:0 12px 30px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.menu button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#ddd;
  padding:13px 14px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
}

.menu button:hover,
.menu button.active{
  background:#333;
  color:white;
}


/* ================= MAIN ================= */

.main{
  margin-left:240px;
  min-height:100vh;
}


/* ================= TOPBAR ================= */

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:900;
}

.topbar h2{
  margin:0;
  font-size:20px;
}

.logout{
  background:#111;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:6px;
  cursor:pointer;
}


/* ================= CONTENT ================= */

.content{
  padding:30px;
  max-width:1400px;
  margin:auto;
}


/* ================= LOGIN ================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f4f5;
}

.login-card{
  background:white;
  width:420px;
  max-width:92%;
  padding:35px;
  border-radius:14px;
  box-shadow:0 5px 25px rgba(0,0,0,.10);
}

.login-card h1{
  margin-top:0;
  margin-bottom:8px;
}

.login-card p{
  color:#777;
  margin-bottom:25px;
}


/* ================= INPUTS ================= */

input,
textarea,
select{
  width:100%;
  border:1px solid #ccc;
  background:white;
  padding:12px;
  border-radius:7px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#111;
}

textarea{
  min-height:100px;
  resize:vertical;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.form-group{
  margin-bottom:17px;
}


/* ================= BUTTONS ================= */

.btn{
  border:0;
  background:#111;
  color:white;
  padding:11px 17px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
}

.btn:hover{
  opacity:.85;
}

.btn-danger{
  background:#c62828;
}

.btn-light{
  background:#eee;
  color:#222;
}


/* ================= DASHBOARD CARDS ================= */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:12px;
  padding:22px;
}

.stat-title{
  color:#777;
  font-size:13px;
  margin-bottom:10px;
}

.stat-number{
  font-size:30px;
  font-weight:bold;
}


/* ================= CARD ================= */

.card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:12px;
  padding:24px;
  margin-bottom:22px;
}

.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.card-header h2{
  margin:0;
  font-size:20px;
}


/* ================= PRODUCT FORM ================= */

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:18px;
}

.full{
  grid-column:1/-1;
}

.image-preview{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
  margin-top:10px;
  display:none;
}


/* ================= PRODUCTS ================= */

.search-row{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

.search-row input{
  flex:1;
}

.product-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:18px;
}

.product-card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.product-card img{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#eee;
}

.product-body{
  padding:16px;
}

.product-body h3{
  margin:0 0 8px;
  font-size:17px;
}

.product-price{
  font-weight:bold;
  font-size:18px;
  margin-bottom:7px;
}

.product-meta{
  color:#777;
  font-size:13px;
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
  background:#eee;
}

.badge-active{
  background:#e6f5e9;
  color:#176b2c;
}

.badge-inactive{
  background:#ffe9e9;
  color:#a00000;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.actions button{
  flex:1;
}


/* ================= ORDERS ================= */

.order{
  border:1px solid #ddd;
  border-radius:10px;
  padding:18px;
  margin-bottom:14px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:14px;
}

.order-top h3{
  margin:0;
}

.order-info{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:8px;
  font-size:14px;
  color:#555;
}

.order-status{
  margin-top:15px;
}


/* ================= MESSAGES ================= */

.message{
  padding:12px;
  border-radius:7px;
  margin-top:12px;
  font-size:14px;
}

.success{
  background:#e8f7e8;
  color:#176b17;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}


/* ================= SECTIONS ================= */

.section{
  display:none;
}

.section.active{
  display:block;
}


/* ================= MOBILE ================= */

.mobile-menu{
  display:none;
}

@media(max-width:1000px){

  .product-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:700px){

  .sidebar{
    width:220px;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .mobile-menu{
    display:block;
    background:#111;
    color:white;
    border:0;
    padding:9px 12px;
    border-radius:6px;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:18px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product-grid{
    grid-template-columns:1fr;
  }

  .order-info{
    grid-template-columns:1fr;
  }

  .search-row{
    display:block;
  }

  .search-row input{
    margin-bottom:10px;
  }

}

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

}

</style>

</head>


<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

  <div class="login-card">

    <h1>My Store</h1>

    <p>
      Admin Dashboard
    </p>

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Admin email"
      >

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

    </div>

    <button
      class="btn"
      style="width:100%"
      onclick="login()"
    >
      Login
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminApp" style="display:none">


<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

  <div class="brand">
    My Store
  </div>

  <div class="menu">

    <button
      class="active"
      onclick="showSection('dashboard',this)"
    >
      📊 Dashboard
    </button>

    <button
      onclick="showSection('products',this)"
    >
      🛍️ Products
    </button>

    <button
      onclick="showSection('addProduct',this)"
    >
      ➕ Add Product
    </button>

    <button
      onclick="showSection('orders',this)"
    >
      📋 Orders
    </button>

  </div>

</aside>


<!-- MAIN -->

<div class="main">


<!-- TOPBAR -->

<div class="topbar">

  <div style="display:flex;align-items:center;gap:12px">

    <button
      class="mobile-menu"
      onclick="toggleSidebar()"
    >
      ☰
    </button>

    <h2 id="pageTitle">
      Dashboard
    </h2>

  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Logout
  </button>

</div>


<div class="content">


<!-- ================= DASHBOARD ================= -->

<section
  id="dashboard"
  class="section active"
>

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Total Products
      </div>

      <div
        class="stat-number"
        id="totalProducts"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Active Products
      </div>

      <div
        class="stat-number"
        id="activeProducts"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Total Orders
      </div>

      <div
        class="stat-number"
        id="totalOrders"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Pending Orders
      </div>

      <div
        class="stat-number"
        id="pendingOrders"
      >
        0
      </div>

    </div>

  </div>


  <div class="card">

    <div class="card-header">

      <h2>
        Recent Orders
      </h2>

      <button
        class="btn btn-light"
        onclick="showSectionByName('orders')"
      >
        View All
      </button>

    </div>

    <div id="recentOrders">
      Loading...
    </div>

  </div>

</section>


<!-- ================= PRODUCTS ================= -->

<section
  id="products"
  class="section"
>

  <div class="card">

    <div class="card-header">

      <h2>
        Products
      </h2>

      <button
        class="btn"
        onclick="showSectionByName('addProduct')"
      >
        + Add Product
      </button>

    </div>


    <div class="search-row">

      <input
        type="search"
        id="productSearch"
        placeholder="🔎 Search products..."
        oninput="renderProducts()"
      >

      <select
        id="productFilter"
        onchange="renderProducts()"
        style="max-width:220px"
      >

        <option value="all">
          All Products
        </option>

        <option value="active">
          Active
        </option>

        <option value="inactive">
          Inactive
        </option>

      </select>

    </div>


    <div
      id="productsList"
      class="product-grid"
    >
      Loading...
    </div>

  </div>

</section>


<!-- ================= ADD / EDIT ================= -->

<section
  id="addProduct"
  class="section"
>

  <div class="card">

    <div class="card-header">

      <h2 id="formTitle">
        Add Product
      </h2>

      <button
        class="btn btn-light"
        onclick="resetProductForm()"
      >
        Clear
      </button>

    </div>


    <form id="productForm">

      <input
        type="hidden"
        id="editProductId"
      >


      <div class="form-grid">


        <div class="form-group">

          <label>
            Product Name *
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Example: Black Watch"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Product Slug *
          </label>

          <input
            type="text"
            id="productSlug"
            placeholder="black-watch"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Price (PKR) *
          </label>

          <input
            type="number"
            id="productPrice"
            min="0"
            placeholder="1500"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Stock *
          </label>

          <input
            type="number"
            id="productStock"
            min="0"
            value="1"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Category
          </label>

          <input
            type="text"
            id="productCategory"
            placeholder="Watches, Shoes, Electronics..."
          >

        </div>


        <div class="form-group">

          <label>
            Status
          </label>

          <select id="productStatus">

            <option value="active">
              Active
            </option>

            <option value="inactive">
              Inactive
            </option>

          </select>

        </div>


        <div class="form-group full">

          <label>
            Product Description
          </label>

          <textarea
            id="productDescription"
            placeholder="Write product details..."
          ></textarea>

        </div>


        <div class="form-group full">

          <label>
            Product Image
          </label>

          <input
            type="file"
            id="productImage"
            accept="image/*"
            onchange="previewImage()"
          >

          <img
            id="imagePreview"
            class="image-preview"
            alt="Preview"
          >

        </div>


      </div>


      <button
        type="submit"
        class="btn"
        id="saveProductButton"
      >
        Add Product
      </button>


      <div id="productMessage"></div>

    </form>

  </div>

</section>


<!-- ================= ORDERS ================= -->

<section
  id="orders"
  class="section"
>

  <div class="card">

    <div class="card-header">

      <h2>
        Orders
      </h2>

      <button
        class="btn btn-light"
        onclick="loadOrders()"
      >
        Refresh
      </button>

    </div>


    <div id="ordersList">
      Loading orders...
    </div>

  </div>

</section>


</div>

</div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://qmchlafchuvldumxurbl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WXqvOXVXfmojAFPOG74SQw_fvurPlBB";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allProducts = [];

let allOrders = [];


/* =====================================
   LOGIN
===================================== */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.innerHTML =
    "";


  const {error} =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    message.innerHTML = `
      <div class="message error">
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  showAdmin();

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  await db.auth.signOut();

  document.getElementById(
    "adminApp"
  ).style.display = "none";

  document.getElementById(
    "loginPage"
  ).style.display = "flex";

}


/* =====================================
   CHECK LOGIN
===================================== */

async function checkLogin(){

  const {
    data:{session}
  } =
    await db.auth.getSession();


  if(session){

    showAdmin();

  }

}


/* =====================================
   SHOW ADMIN
===================================== */

function showAdmin(){

  document.getElementById(
    "loginPage"
  ).style.display = "none";

  document.getElementById(
    "adminApp"
  ).style.display = "block";


  loadProducts();

  loadOrders();

}


/* =====================================
   SECTION NAVIGATION
===================================== */

function showSection(name,button){

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove(
        "active"
      );

    });


  document
    .getElementById(name)
    .classList.add("active");


  document
    .querySelectorAll(".menu button")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  if(button){

    button.classList.add("active");

  }


  const titles = {

    dashboard:"Dashboard",

    products:"Products",

    addProduct:"Add Product",

    orders:"Orders"

  };


  document.getElementById(
    "pageTitle"
  ).textContent =
    titles[name] || "Admin";


  document
    .getElementById("sidebar")
    .classList.remove("open");

}


function showSectionByName(name){

  const button =
    [...document.querySelectorAll(
      ".menu button"
    )]
    .find(btn =>
      btn.getAttribute("onclick")
      ?.includes(
        `'${name}'`
      )
    );


  showSection(name,button);

}


function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


/* =====================================
   ADD / EDIT PRODUCT
===================================== */

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const message =
        document.getElementById(
          "productMessage"
        );


      const editId =
        document.getElementById(
          "editProductId"
        ).value;


      const name =
        document.getElementById(
          "productName"
        ).value.trim();


      const slug =
        document.getElementById(
          "productSlug"
        ).value.trim()
        .toLowerCase()
        .replace(/\s+/g,"-");


      const price =
        Number(
          document.getElementById(
            "productPrice"
          ).value
        );


      const stock =
        Number(
          document.getElementById(
            "productStock"
          ).value
        );


      const category =
        document.getElementById(
          "productCategory"
        ).value.trim()
        || "General";


      const status =
        document.getElementById(
          "productStatus"
        ).value;


      const description =
        document.getElementById(
          "productDescription"
        ).value.trim();


      const imageFile =
        document.getElementById(
          "productImage"
        ).files[0];


      message.innerHTML =
        `<div class="message">
          Saving product...
        </div>`;


      let imageUrl = null;


      /* EDIT: KEEP OLD IMAGE */

      if(editId){

        const oldProduct =
          allProducts.find(
            p =>
              String(p.id) ===
              String(editId)
          );

        imageUrl =
          oldProduct?.image_url ||
          null;

      }


      /* UPLOAD NEW IMAGE */

      if(imageFile){

        const safeName =
          imageFile.name
            .replace(/[^a-zA-Z0-9._-]/g,"-");


        const fileName =
          Date.now() +
          "-" +
          safeName;


        const {
          error:uploadError
        } =
          await db.storage
            .from("product-images")
            .upload(
              fileName,
              imageFile
            );


        if(uploadError){

          message.innerHTML = `
            <div class="message error">
              Image upload failed:
              ${escapeHtml(
                uploadError.message
              )}
            </div>
          `;

          return;
        }


        const {data:urlData} =
          db.storage
            .from("product-images")
            .getPublicUrl(
              fileName
            );


        imageUrl =
          urlData.publicUrl;

      }


      const productData = {

        name:name,

        slug:slug,

        price:price,

        description:description,

        image_url:imageUrl,

        stock:stock,

        status:status,

        category:category

      };


      let result;


      /* EDIT */

      if(editId){

        result =
          await db
            .from("products")
            .update(productData)
            .eq("id",editId);

      }

      /* ADD */

      else{

        result =
          await db
            .from("products")
            .insert([
              productData
            ]);

      }


      if(result.error){

        message.innerHTML = `
          <div class="message error">
            ${escapeHtml(
              result.error.message
            )}
          </div>
        `;

        return;
      }


      message.innerHTML = `
        <div class="message success">
          ✅ Product saved successfully!
        </div>
      `;


      resetProductForm();

      await loadProducts();


      setTimeout(() => {

        showSectionByName(
          "products"
        );

      },700);

    }
  );


/* =====================================
   IMAGE PREVIEW
===================================== */

function previewImage(){

  const file =
    document.getElementById(
      "productImage"
    ).files[0];

  const preview =
    document.getElementById(
      "imagePreview"
    );


  if(!file){

    preview.style.display =
      "none";

    return;

  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

}


/* =====================================
   RESET FORM
===================================== */

function resetProductForm(){

  document
    .getElementById("productForm")
    .reset();


  document.getElementById(
    "editProductId"
  ).value = "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Product";


  document.getElementById(
    "saveProductButton"
  ).textContent =
    "Add Product";


  document.getElementById(
    "imagePreview"
  ).style.display =
    "none";


  document.getElementById(
    "productMessage"
  ).innerHTML = "";

}


/* =====================================
   LOAD PRODUCTS
===================================== */

async function loadProducts(){

  const {data,error} =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    document.getElementById(
      "productsList"
    ).innerHTML = `
      <div class="message error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    return;

  }


  allProducts =
    data || [];


  updateStats();

  renderProducts();

}


/* =====================================
   RENDER PRODUCTS
===================================== */

function renderProducts(){

  const list =
    document.getElementById(
      "productsList"
    );


  const search =
    document.getElementById(
      "productSearch"
    )
    .value
    .toLowerCase()
    .trim();


  const filter =
    document.getElementById(
      "productFilter"
    ).value;


  const filtered =
    allProducts.filter(product => {

      const matchesSearch =
        (product.name || "")
          .toLowerCase()
          .includes(search);


      const matchesFilter =
        filter === "all" ||
        product.status === filter;


      return (
        matchesSearch &&
        matchesFilter
      );

    });


  if(filtered.length === 0){

    list.innerHTML = `
      <div
        class="message"
        style="grid-column:1/-1"
      >
        No products found.
      </div>
    `;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(product => {

    const div =
      document.createElement("div");


    div.className =
      "product-card";


    const image =
      product.image_url ||
      "https://via.placeholder.com/600x500?text=Product";


    const statusClass =
      product.status === "active"
      ? "badge-active"
      : "badge-inactive";


    div.innerHTML = `

      <img
        src="${image}"
        alt="${escapeHtml(
          product.name
        )}"
      >

      <div class="product-body">

        <span
          class="badge ${statusClass}"
        >
          ${escapeHtml(
            product.status || "active"
          )}
        </span>

        <h3>
          ${escapeHtml(
            product.name
          )}
        </h3>

        <div class="product-price">
          Rs.
          ${Number(
            product.price || 0
          ).toLocaleString()}
        </div>

        <div class="product-meta">
          Category:
          ${escapeHtml(
            product.category ||
            "General"
          )}
          <br>
          Stock:
          ${product.stock || 0}
        </div>

        <div class="actions">

          <button
            class="btn"
            onclick="editProduct(${product.id})"
          >
            Edit
          </button>

          <button
            class="btn btn-danger"
            onclick="deleteProduct(${product.id})"
          >
            Delete
          </button>

        </div>

      </div>

    `;


    list.appendChild(div);

  });

}


/* =====================================
   EDIT PRODUCT
===================================== */

function editProduct(id){

  const product =
    allProducts.find(
      p => Number(p.id) === Number(id)
    );


  if(!product) return;


  document.getElementById(
    "editProductId"
  ).value =
    product.id;


  document.getElementById(
    "productName"
  ).value =
    product.name || "";


  document.getElementById(
    "productSlug"
  ).value =
    product.slug || "";


  document.getElementById(
    "productPrice"
  ).value =
    product.price || 0;


  document.getElementById(
    "productStock"
  ).value =
    product.stock || 0;


  document.getElementById(
    "productCategory"
  ).value =
    product.category || "General";


  document.getElementById(
    "productStatus"
  ).value =
    product.status || "active";


  document.getElementById(
    "productDescription"
  ).value =
    product.description || "";


  if(product.image_url){

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src =
      product.image_url;

    preview.style.display =
      "block";

  }


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Product";


  document.getElementById(
    "saveProductButton"
  ).textContent =
    "Update Product";


  showSectionByName(
    "addProduct"
  );

}


/* =====================================
   DELETE PRODUCT
===================================== */

async function deleteProduct(id){

  const product =
    allProducts.find(
      p => Number(p.id) === Number(id)
    );


  if(!product) return;


  const confirmDelete =
    confirm(
      `Delete "${product.name}"?`
    );


  if(!confirmDelete) return;


  const {error} =
    await db
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  await loadProducts();

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

  const list =
    document.getElementById(
      "ordersList"
    );


  const {data,error} =
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    list.innerHTML = `
      <div class="message error">
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

    return;

  }


  allOrders =
    data || [];


  updateStats();

  renderOrders();

  renderRecentOrders();

}


/* =====================================
   RENDER ORDERS
===================================== */

function renderOrders(){

  const list =
    document.getElementById(
      "ordersList"
    );


  if(allOrders.length === 0){

    list.innerHTML =
      "<p>No orders yet.</p>";

    return;

  }


  list.innerHTML = "";


  allOrders.forEach(order => {

    const div =
      document.createElement("div");


    div.className =
      "order";


    div.innerHTML = `

      <div class="order-top">

        <h3>
          Order #${order.id}
        </h3>

        <span class="badge">
          ${escapeHtml(
            order.status ||
            "pending"
          )}
        </span>

      </div>


      <div class="order-info">

        <div>
          <b>Customer:</b>
          ${escapeHtml(
            order.customer_name
          )}
        </div>

        <div>
          <b>Phone:</b>
          ${escapeHtml(
            order.phone
          )}
        </div>

        <div>
          <b>City:</b>
          ${escapeHtml(
            order.city || ""
          )}
        </div>

        <div>
          <b>Quantity:</b>
          ${order.quantity || 1}
        </div>

        <div style="grid-column:1/-1">
          <b>Address:</b>
          ${escapeHtml(
            order.address
          )}
        </div>

        <div style="grid-column:1/-1">
          <b>Note:</b>
          ${escapeHtml(
            order.note || "-"
          )}
        </div>

      </div>


      <div class="order-status">

        <label>
          Update Order Status
        </label>

        <select
          onchange="
            updateOrderStatus(
              ${order.id},
              this.value
            )
          "
        >

          <option
            value="pending"
            ${order.status==="pending"
              ?"selected":""}
          >
            Pending
          </option>

          <option
            value="confirmed"
            ${order.status==="confirmed"
              ?"selected":""}
          >
            Confirmed
          </option>

          <option
            value="shipped"
            ${order.status==="shipped"
              ?"selected":""}
          >
            Shipped
          </option>

          <option
            value="delivered"
            ${order.status==="delivered"
              ?"selected":""}
          >
            Delivered
          </option>

          <option
            value="cancelled"
            ${order.status==="cancelled"
              ?"selected":""}
          >
            Cancelled
          </option>

        </select>

      </div>

    `;


    list.appendChild(div);

  });

}


/* =====================================
   RECENT ORDERS
===================================== */

function renderRecentOrders(){

  const list =
    document.getElementById(
      "recentOrders"
    );


  const recent =
    allOrders.slice(0,5);


  if(recent.length === 0){

    list.innerHTML =
      "<p>No orders yet.</p>";

    return;

  }


  list.innerHTML = "";


  recent.forEach(order => {

    const div =
      document.createElement("div");


    div.className =
      "order";


    div.innerHTML = `

      <div class="order-top">

        <h3>
          #${order.id}
          —
          ${escapeHtml(
            order.customer_name
          )}
        </h3>

        <span class="badge">
          ${escapeHtml(
            order.status ||
            "pending"
          )}
        </span>

      </div>

      <div style="color:#777">

        ${escapeHtml(
          order.phone
        )}
        ·
        ${escapeHtml(
          order.city || ""
        )}

      </div>

    `;


    list.appendChild(div);

  });

}


/* =====================================
   UPDATE ORDER
===================================== */

async function updateOrderStatus(
  id,
  status
){

  const {error} =
    await db
      .from("orders")
      .update({
        status:status
      })
      .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  await loadOrders();

}


/* =====================================
   STATS
===================================== */

function updateStats(){

  const totalProducts =
    allProducts.length;


  const activeProducts =
    allProducts.filter(
      p => p.status === "active"
    ).length;


  const totalOrders =
    allOrders.length;


  const pendingOrders =
    allOrders.filter(
      o =>
        !o.status ||
        o.status === "pending"
    ).length;


  document.getElementById(
    "totalProducts"
  ).textContent =
    totalProducts;


  document.getElementById(
    "activeProducts"
  ).textContent =
    activeProducts;


  document.getElementById(
    "totalOrders"
  ).textContent =
    totalOrders;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pendingOrders;

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   START
===================================== */

checkLogin();

</script>
